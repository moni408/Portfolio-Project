  <body>

      <input type="checkbox" id="check" />

      <label for="check" class="nav-overlay"></label>
      <aside class="aside">
        <div class="logo">
          <a href="home.html"><span>Ayesha</span></a>

        <ul class="nav">
          <li>
            <a href="home.html"><i class="fa fa-home"></i>Home</a>

          <li>
